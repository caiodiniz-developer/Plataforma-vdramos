    <rect x="90" y="800" width="140" height="40"/><rect x="290" y="800" width="140" height="40"/><rect x="490" y="800" width="140" height="40"/><rect x="690" y="800" width="140" height="40"/><rect x="890" y="800" width="140" height="40"/>
