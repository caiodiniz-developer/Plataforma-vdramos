# Configuração do projeto Supabase (CLI). Nenhum segredo fica neste arquivo:
# chaves e senhas entram por variáveis de ambiente (`supabase secrets set`).

project_id = "plataforma-vitor-ramos"

[api]
schemas = ["public"]
max_rows = 1000

[db]
major_version = 17

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://vitorramos.com"]
# PRD F4: o aluno fica logado por 30 dias no mesmo aparelho. O refresh token
# renova a sessão; a expiração total é configurada no painel (Auth > Sessions).
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Contas de aluno nascem pela Edge Function `acesso-aluno` (OTP por e-mail).
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
# PRD, seção 7: código de 6 dígitos, válido por 10 min, reenvio após 60 s.
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

# As três funções validam a autorização por conta própria: `contato` e
# `acesso-aluno` são públicas por definição; `excluir-conta` confere o JWT.
[functions.acesso-aluno]
verify_jwt = false

[functions.contato]
verify_jwt = false

[functions.excluir-conta]
verify_jwt = true

# Confere a sessao e o papel admin dentro da funcao.
[functions.admin-alunos]
verify_jwt = true

# Conferem a sessao dentro da funcao: `notificar-resposta` aceita o aluno que
# respondeu; `enviar-aviso`, so o professor.
[functions.notificar-resposta]
verify_jwt = true

[functions.enviar-aviso]
verify_jwt = true
